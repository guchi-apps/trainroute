<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="trainroute">
  <!--
    purpose="maskable" 用。Android は端末ごとに違う形（円・角丸・雫）で切り抜くため、
    角を丸めず地を四隅まで塗り、図柄は中央 80%（半径 205px）のセーフゾーンへ収めている。
    assets/icon.svg と図柄は同じで、縮尺と位置だけが違う。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2c47"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(130 110) scale(10.5)" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3.1V7a4 4 0 0 0 8 0V3.1"/>
    <path d="m9 15-1-1"/>
    <path d="m15 15 1-1"/>
    <path d="M9 19c-2.8 0-5-2.2-5-5v-4a8 8 0 0 1 16 0v4c0 2.8-2.2 5-5 5Z"/>
    <path d="m8 19-2 3"/>
    <path d="m16 19 2 3"/>
  </g>
  <line x1="150" y1="382" x2="362" y2="382" stroke="#4493f8" stroke-width="17" stroke-linecap="round"/>
  <circle cx="150" cy="382" r="10" fill="#ffffff"/>
  <circle cx="362" cy="382" r="10" fill="#ffffff"/>
</svg>
