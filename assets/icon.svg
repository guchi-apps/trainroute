<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="trainroute">
  <!--
    trainroute のアプリアイコン（角丸あり・purpose="any" 用）。
    図柄は lucide の TrainFront（ISC）を 24 グリッドのまま拡大したもの。
    下の線は「2つの駅を結ぶ経路」で、アプリのアクセント色 (#4493f8) をここに残している。
    サイズ違いは scripts/generate-icons.sh が書き出すので、直すのはこのファイルだけでよい。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2c47"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <g transform="translate(94 55) scale(13.5)" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3.1V7a4 4 0 0 0 8 0V3.1"/>
    <path d="m9 15-1-1"/>
    <path d="m15 15 1-1"/>
    <path d="M9 19c-2.8 0-5-2.2-5-5v-4a8 8 0 0 1 16 0v4c0 2.8-2.2 5-5 5Z"/>
    <path d="m8 19-2 3"/>
    <path d="m16 19 2 3"/>
  </g>
  <line x1="104" y1="424" x2="408" y2="424" stroke="#4493f8" stroke-width="22" stroke-linecap="round"/>
  <circle cx="104" cy="424" r="13" fill="#ffffff"/>
  <circle cx="408" cy="424" r="13" fill="#ffffff"/>
</svg>
